<title>Barritas — Panel comercial</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F8FAF8; --surface:#FFFFFF; --ink:#515456; --ink-soft:#828485; --ink-faint:#ABADAE;
  --sage:#8BAA84; --sage-deep:#5A6E56; --sage-pale:#EFF3EE; --sage-line:#CBD9C8;
  --amber:#C97B3D; --terracotta:#B5654A; --line:#DDE3DC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fira Sans Condensed',sans-serif;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:216px;flex-shrink:0;background:#F3EFE6;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;}
.brand{padding:2px 8px 0;margin-bottom:24px;}
.brand-logo{width:150px;max-width:100%;}
.brand-logo svg{width:100%;height:auto;display:block;}
.brand-sub{font-size:10.5px;color:var(--ink-faint);letter-spacing:.3px;text-transform:uppercase;margin-top:6px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:var(--ink-soft);font-weight:500;font-size:14px;cursor:pointer;text-align:left;width:100%;font-family:inherit;}
.nav-item.active{background:var(--sage-pale);color:var(--sage-deep);font-weight:600;}
.nav-item:hover:not(.active){background:#EDE9DD;}
.sidebar-footer{margin-top:auto;padding:10px 8px;font-size:11px;color:var(--ink-faint);line-height:1.5;}
.main{flex:1;min-width:0;padding:26px 30px;overflow:auto;}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.page-title{font-family:'Fira Sans Condensed',sans-serif;font-weight:600;font-size:24px;margin:0;}
.page-sub{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:var(--sage);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-secondary{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
.btn-icon{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);display:inline-flex;padding:2px;font-size:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.2px;text-transform:uppercase;}
.kpi-value{font-family:'Fira Sans Condensed',sans-serif;font-size:26px;font-weight:600;line-height:1.1;}
.kpi-sub{font-size:12px;color:var(--ink-faint);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;}
.card-title{margin:0 0 12px;font-weight:600;font-size:13.5px;}
.empty-state{background:var(--surface);border:1px dashed var(--sage-line);border-radius:14px;padding:28px 24px;text-align:center;color:var(--ink-soft);margin-bottom:22px;}
.empty-state strong{display:block;margin-bottom:4px;color:var(--ink);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead tr{background:#F3EFE6;text-align:left;}
th{padding:10px 12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
td{padding:8px 12px;border-top:1px solid var(--line);}
.table-wrap{overflow-x:auto;}
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;outline:none;width:100%;}
input:focus,select:focus{border-color:var(--sage);}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.cell-input{padding:5px 7px;}
.gauge{width:100%;height:8px;border-radius:8px;background:var(--sage-pale);overflow:hidden;}
.gauge-fill{height:100%;border-radius:8px;}
.modal{position:relative;margin-bottom:20px;background:var(--surface);border:1px solid var(--sage-line);border-radius:14px;padding:20px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{margin:0;font-weight:600;font-size:15px;font-family:'Fira Sans Condensed',sans-serif;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row{display:grid;grid-template-columns:1.6fr .7fr .9fr 1fr 1fr auto;gap:10px;align-items:end;}
.form-row-compras{display:grid;grid-template-columns:1.3fr .8fr .9fr .9fr .9fr auto;gap:10px;align-items:end;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:10px;}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
@media (max-width:760px){
  .app-shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:12px;}
  .sidebar-footer{display:none;}
  .form-row,.form-row-compras,.form-grid{grid-template-columns:1fr;}
}
</style>
</head>

function uid(p){ return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
function fmt(n){ n = Number.isFinite(n) ? n : 0; return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n); }
function fmtNum(n){ n = Number.isFinite(n) ? n : 0; return new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n); }
function pct(n){ n = Number.isFinite(n) ? n : 0; return (n*100).toFixed(1) + '%'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(s){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s];
  });
}

function seedProducts(){
  return RAW_PRODUCTS.map(function(r){
    var proveedor=r[0], marca=r[1], presentacion=r[2], costoCaja=r[3], precioVenta=r[4];
    return {
      id: uid('p'), proveedor: proveedor, marca: marca, presentacion: presentacion,
      costoCaja: costoCaja, precioVenta: precioVenta, stock: 0,
      stockMinimo: Math.max(6, Math.round(presentacion/2))
    };
  });
}

function withDerived(p){
  var costoUnidad = p.presentacion > 0 ? p.costoCaja / p.presentacion : 0;
  var gananciaUnidad = p.precioVenta - costoUnidad;
  var margenVenta = p.precioVenta > 0 ? gananciaUnidad / p.precioVenta : 0;
  var valorStock = p.stock * costoUnidad;
  var out = {};
  for (var k in p) out[k] = p[k];
  out.costoUnidad = costoUnidad;
  out.gananciaUnidad = gananciaUnidad;
  out.margenVenta = margenVenta;
  out.valorStock = valorStock;
  return out;
}

function load(){
  try{
    var raw = localStorage.getItem('erp-barritas-data');
    if(raw){
      var data = JSON.parse(raw);
      productos = (data.productos && data.productos.length) ? data.productos : seedProducts();
      ventas = data.ventas || [];
      compras = data.compras || [];
    } else {
      productos = seedProducts();
    }
  } catch(e){
    productos = seedProducts();
  }
}

function save(){
  try{
    localStorage.setItem('erp-barritas-data', JSON.stringify({productos:productos, ventas:ventas, compras:compras}));
    saveError = false;
  } catch(e){
    saveError = true;
  }
}

function kpiCard(label, value, sub, accent){
  return '<div class="kpi-card"><span class="kpi-label">' + label + '</span>' +
    '<span class="kpi-value" style="color:' + (accent || 'var(--ink)') + '">' + value + '</span>' +
    (sub ? '<span class="kpi-sub">' + sub + '</span>' : '') + '</div>';
}

function render(){
  var app = document.getElementById('app');
  app.innerHTML =
    '<div class="app-shell">' +
      '<aside class="sidebar">' +
        '<div class="brand"><div class="brand-logo">' + BRAND_LOGO_SVG + '</div><div class="brand-sub">Barritas nutricionales</div></div>' +
        renderNav() +
        '<div class="sidebar-footer">' + (saveError ? 'No se pudieron guardar los últimos cambios (revisá el espacio de almacenamiento del navegador).' : 'Los datos se guardan automáticamente en este navegador.') + '</div>' +
      '</aside>' +
      '<main class="main" id="main-content"></main>' +
    '</div>';

  var navBtns = document.querySelectorAll('.nav-item');
  for (var i=0;i<navBtns.length;i++){
    navBtns[i].addEventListener('click', function(e){
      currentTab = e.currentTarget.getAttribute('data-tab');
      showAddProduct = false;
      render();
    });
  }
  renderTab();
}

function renderNav(){
  var tabs = [['dashboard','Dashboard'],['catalogo','Catálogo y stock'],['ventas','Ventas'],['compras','Compras']];
  return tabs.map(function(t){
    return '<button class="nav-item ' + (currentTab===t[0]?'active':'') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join('');
}

function renderTab(){
  var main = document.getElementById('main-content');
  if(currentTab==='dashboard'){ main.innerHTML = dashboardHTML(); attachDashboardCharts(); }
  else if(currentTab==='catalogo'){ main.innerHTML = catalogoHTML(); attachCatalogoHandlers(); }
  else if(currentTab==='ventas'){ main.innerHTML = ventasHTML(); attachVentasHandlers(); }
  else if(currentTab==='compras'){ main.innerHTML = comprasHTML(); attachComprasHandlers(); }
}

function dashboardHTML(){
  var prod = productos.map(withDerived);
  var totalUnidadesVendidas = ventas.reduce(function(s,v){return s+v.cantidad;},0);
  var ingresos = ventas.reduce(function(s,v){return s+v.total;},0);
  var gananciaTotal = ventas.reduce(function(s,v){return s+v.gananciaTotal;},0);
  var margenPromedio = ingresos>0 ? gananciaTotal/ingresos : 0;
  var valorStock = prod.reduce(function(s,p){return s+p.valorStock;},0);
  var unidadesStock = prod.reduce(function(s,p){return s+p.stock;},0);
  var bajoStock = prod.filter(function(p){return p.stock<=p.stockMinimo;});

  var chartsSection;
  if(ventas.length===0){
    chartsSection = '<div class="empty-state"><strong>Todavía no hay ventas cargadas</strong>' +
      '<p style="margin:0;font-size:13.5px;">Cargá stock inicial en Catálogo y registrá tu primera venta para ver los indicadores acá.</p></div>';
  } else {
    chartsSection =
      '<div class="form-grid" style="grid-template-columns:1.4fr 1fr;margin-bottom:22px;">' +
        '<div class="card"><p class="card-title">Ganancia por marca</p>' +
          '<div style="position:relative;height:220px;"><canvas id="chart-bar" role="img" aria-label="Ganancia por marca"></canvas></div></div>' +
        '<div class="card"><p class="card-title">Ventas por canal</p>' +
          '<div style="position:relative;height:190px;"><canvas id="chart-pie" role="img" aria-label="Ventas por canal"></canvas></div>' +
          '<div class="legend" id="pie-legend"></div></div>' +
      '</div>';
  }

  var alertsHTML;
  if(bajoStock.length===0){
    alertsHTML = '<p style="font-size:13px;color:var(--ink-soft);margin:0;">Ningún producto está por debajo de su mínimo.</p>';
  } else {
    alertsHTML = bajoStock.map(function(p){
      var w = Math.min(100, p.stock/Math.max(p.stockMinimo*2,1)*100);
      var color = p.stock===0 ? 'var(--terracotta)' : 'var(--amber)';
      return '<div style="display:grid;grid-template-columns:1fr 100px 90px;gap:10px;align-items:center;">' +
        '<span style="font-size:13px;">' + escapeHtml(p.marca) + ' <span style="color:var(--ink-faint);">· ' + escapeHtml(p.proveedor) + '</span></span>' +
        '<div class="gauge"><div class="gauge-fill" style="width:' + w + '%;background:' + color + ';"></div></div>' +
        '<span style="font-size:12.5px;text-align:right;color:var(--ink-soft);">' + p.stock + ' / mín. ' + p.stockMinimo + '</span>' +
      '</div>';
    }).join('');
  }

  return '<div class="section-title"><div><h1 class="page-title">Dashboard</h1><p class="page-sub">Resumen del negocio de barritas nutricionales</p></div></div>' +
    '<div class="kpi-grid">' +
      kpiCard('Ingresos totales', fmt(ingresos), fmtNum(totalUnidadesVendidas) + ' unidades vendidas') +
      kpiCard('Ganancia total', fmt(gananciaTotal), 'Margen prom. ' + pct(margenPromedio), 'var(--sage-deep)') +
      kpiCard('Valor de stock', fmt(valorStock), fmtNum(unidadesStock) + ' unidades en depósito') +
      kpiCard('Stock bajo mínimo', fmtNum(bajoStock.length), bajoStock.length ? 'productos para reponer' : 'todo en orden', bajoStock.length ? 'var(--terracotta)' : 'var(--sage-deep)') +
    '</div>' +
    chartsSection +
    '<div class="card"><p class="card-title">Alertas de stock</p><div style="display:flex;flex-direction:column;gap:10px;">' + alertsHTML + '</div></div>';
}

function attachDashboardCharts(){
  if(ventas.length===0) return;
  var map = {};
  ventas.forEach(function(v){ map[v.marca] = (map[v.marca]||0) + v.gananciaTotal; });
  var topPorGanancia = Object.keys(map).map(function(marca){ return {marca:marca, ganancia:Math.round(map[marca])}; })
    .sort(function(a,b){ return b.ganancia-a.ganancia; }).slice(0,6);

  var canalMap = {};
  ventas.forEach(function(v){ var k=v.canal||'Sin canal'; canalMap[k]=(canalMap[k]||0)+v.total; });
  var porCanal = Object.keys(canalMap).map(function(canal){ return {canal:canal, total:Math.round(canalMap[canal])}; });

  var barEl = document.getElementById('chart-bar');
  if(chartBar){ chartBar.destroy(); }
  if(barEl){
    chartBar = new Chart(barEl, {
      type:'bar',
      data:{ labels: topPorGanancia.map(function(d){return d.marca;}),
        datasets:[{ label:'Ganancia', data: topPorGanancia.map(function(d){return d.ganancia;}), backgroundColor:'#7C9468', borderRadius:6, maxBarThickness:28 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return fmt(ctx.parsed.y); } } } },
        scales:{ x:{ ticks:{ font:{size:10.5}, autoSkip:false, maxRotation:35 }, grid:{display:false} },
                 y:{ ticks:{ font:{size:11} }, grid:{ color:'#E4DFD3' } } } }
    });
  }

  var pieColors = ['#7C9468','#C97B3D','#8B9DB8','#B5654A','#B8A15C','#9B8AA6'];
  var pieEl = document.getElementById('chart-pie');
  if(chartPie){ chartPie.destroy(); }
  if(pieEl){
    chartPie = new Chart(pieEl, {
      type:'doughnut',
      data:{ labels: porCanal.map(function(d){return d.canal;}),
        datasets:[{ data: porCanal.map(function(d){return d.total;}),
          backgroundColor: porCanal.map(function(_,i){ return pieColors[i%pieColors.length]; }), borderColor:'#FAF7F1', borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(ctx){ return ctx.label + ': ' + fmt(ctx.parsed); } } } } }
    });
  }

  var legendEl = document.getElementById('pie-legend');
  if(legendEl){
    var total = porCanal.reduce(function(s,d){return s+d.total;},0);
    legendEl.innerHTML = porCanal.map(function(d,i){
      var p = total>0 ? Math.round(d.total/total*100) : 0;
      return '<span><span class="legend-dot" style="background:' + pieColors[i%pieColors.length] + '"></span>' + d.canal + ' ' + p + '%</span>';
    }).join('');
  }
}

function catalogoHTML(){
  var prod = productos.map(withDerived);
  var rows = prod.map(function(p){
    var bajo = p.stock <= p.stockMinimo;
    var w = Math.min(100, p.stock/Math.max(p.stockMinimo*2,1)*100);
    return '<tr data-id="' + p.id + '">' +
      '<td><input class="cell-input" style="width:140px;font-weight:500;" type="text" data-field="marca" value="' + escapeHtml(p.marca) + '"></td>' +
      '<td><input class="cell-input" style="width:120px;color:var(--ink-soft);" type="text" data-field="proveedor" value="' + escapeHtml(p.proveedor) + '"></td>' +
      '<td><input class="cell-input" style="width:54px" type="number" step="1" data-field="presentacion" value="' + p.presentacion + '"></td>' +
      '<td><input class="cell-input" style="width:90px" type="number" step="0.01" data-field="costoCaja" value="' + p.costoCaja + '"></td>' +
      '<td style="color:var(--ink-soft);">' + fmt(p.costoUnidad) + '</td>' +
      '<td><input class="cell-input" style="width:78px" type="number" step="1" data-field="precioVenta" value="' + p.precioVenta + '"></td>' +
      '<td style="color:var(--sage-deep);font-weight:600;">' + fmt(p.gananciaUnidad) + '</td>' +
      '<td>' + pct(p.margenVenta) + '</td>' +
      '<td><div style="display:flex;align-items:center;gap:8px;">' +
        '<input class="cell-input" style="width:54px" type="number" step="1" data-field="stock" value="' + p.stock + '">' +
        '<div class="gauge" style="width:44px;height:6px;"><div class="gauge-fill" style="width:' + w + '%;height:6px;background:' + (bajo?'var(--amber)':'var(--sage)') + ';"></div></div>' +
      '</div></td>' +
      '<td><button class="btn-icon" data-action="delete-product" title="Eliminar">✕</button></td>' +

  return '<div class="section-title"><div><h1 class="page-title">Catálogo y stock</h1>' +
    '<p class="page-sub">Editá costo, precio y stock. Márgenes y ganancia se recalculan solos.</p></div>' +
    '<button class="btn-primary" id="btn-add-product">+ Nuevo producto</button></div>' +
    (showAddProduct ? addProductModalHTML() : '') +
    '<div class="table-card"><div class="table-wrap"><table style="min-width:980px;">' +
    '<thead><tr>' + ['Marca','Proveedor','Un./caja','Costo caja','Costo/un.','Precio venta','Ganancia/un.','Margen','Stock',''].map(function(h){return '<th>'+h+'</th>';}).join('') + '</tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>';
}

function addProductModalHTML(){

function attachCatalogoHandlers(){
  var addBtn = document.getElementById('btn-add-product');
  if(addBtn) addBtn.addEventListener('click', function(){ showAddProduct=true; render(); });

  var rows = document.querySelectorAll('#main-content tbody tr');
  rows.forEach(function(tr){
    var id = tr.getAttribute('data-id');
    var textFields = ['marca','proveedor'];
    tr.querySelectorAll('input[data-field]').forEach(function(inp){
      inp.addEventListener('blur', function(e){
        var field = e.target.getAttribute('data-field');
        var p = productos.find(function(x){return x.id===id;});
        if(!p) return;
        if(textFields.indexOf(field)!==-1){
          var text = e.target.value.trim();
          if(text){ p[field]=text; save(); render(); }
          else { e.target.value = p[field]; }
        } else {
          var val = parseFloat(e.target.value);
          if(!isNaN(val)){ p[field]=val; save(); render(); }
        }
      });
    });
    var delBtn = tr.querySelector('[data-action="delete-product"]');
    if(delBtn) delBtn.addEventListener('click', function(){
      var p = productos.find(function(x){return x.id===id;});
      if(p && confirm('¿Eliminar ' + p.marca + ' del catálogo?')){
        productos = productos.filter(function(x){return x.id!==id;});
        save(); render();
      }
    });
  });

  if(showAddProduct){
    var close = function(){ showAddProduct=false; render(); };
    document.getElementById('modal-close').addEventListener('click', close);
    document.getElementById('modal-cancel').addEventListener('click', close);
    document.getElementById('modal-submit').addEventListener('click', function(){
      var marca = document.getElementById('np-marca').value.trim();
      var costo = parseFloat(document.getElementById('np-costo').value);
      var venta = parseFloat(document.getElementById('np-venta').value);
      if(!marca || isNaN(costo) || isNaN(venta)) return;
      productos.push({
        id: uid('p'), marca: marca,
        proveedor: document.getElementById('np-proveedor').value.trim() || 'Sin proveedor',
        presentacion: parseFloat(document.getElementById('np-presentacion').value) || 1,
        costoCaja: costo, precioVenta: venta,
        stock: parseFloat(document.getElementById('np-stock').value) || 0,
        stockMinimo: parseFloat(document.getElementById('np-min').value) || 6
      });
      showAddProduct = false;
      save(); render();
    });
  }
}

function ventasHTML(){
  var prod = productos.map(withDerived);
  var options = prod.map(function(p){
    return '<option value="' + p.id + '" ' + (p.stock===0?'disabled':'') + '>' + escapeHtml(p.marca) + ' ' + (p.stock===0?'(sin stock)':('— stock ' + p.stock)) + '</option>';
  }).join('');
  var rows = ventas.map(function(v){
    return '<tr><td>' + v.fecha + '</td><td style="font-weight:500;">' + escapeHtml(v.marca) + '</td><td>' + v.cantidad + '</td>' +
      '<td style="color:var(--ink-soft);">' + v.canal + '</td><td style="color:var(--ink-soft);">' + (v.cliente ? escapeHtml(v.cliente) : '—') + '</td>' +
      '<td>' + fmt(v.total) + '</td><td style="color:var(--sage-deep);font-weight:600;">' + fmt(v.gananciaTotal) + '</td>' +
      '<td><button class="btn-icon" data-action="delete-venta" data-vid="' + v.id + '">✕</button></td></tr>';
  }).join('');

  return '<div class="section-title"><div><h1 class="page-title">Ventas</h1><p class="page-sub">Registrá cada venta: el stock se descuenta automáticamente.</p></div></div>' +
    '<div class="card" style="margin-bottom:20px;"><div class="form-row">' +
      '<label class="field">Producto<select id="v-producto"><option value="">Elegir producto…</option>' + options + '</select></label>' +
      '<label class="field">Cantidad<input id="v-cantidad" type="number" min="1" value="1"></label>' +
      '<label class="field">Fecha<input id="v-fecha" type="date" value="' + todayStr() + '"></label>' +
      '<label class="field">Canal<select id="v-canal"><option>Presencial</option><option>WhatsApp</option><option>Instagram</option><option>Otro</option></select></label>' +
      '<label class="field">Cliente (opcional)<input id="v-cliente" placeholder="Nombre"></label>' +
      '<button class="btn-primary" id="v-submit">+ Registrar</button>' +
    '</div><p id="v-info" style="margin:10px 0 0;font-size:12.5px;color:var(--ink-soft);"></p></div>' +
    '<div class="table-card"><div class="table-wrap"><table style="min-width:760px;">' +
    '<thead><tr>' + ['Fecha','Producto','Cant.','Canal','Cliente','Total','Ganancia',''].map(function(h){return '<th>'+h+'</th>';}).join('') + '</tr></thead>' +
    '<tbody>' + (ventas.length===0 ? '<tr><td colspan="8" style="padding:18px;text-align:center;color:var(--ink-faint);">Sin ventas registradas todavía.</td></tr>' : rows) + '</tbody></table></div></div>';
}

function attachVentasHandlers(){
  var sel = document.getElementById('v-producto');
  var info = document.getElementById('v-info');
  var updateInfo = function(){
    var p = productos.map(withDerived).filter(function(x){return x.id===sel.value;})[0];
    info.textContent = p ? ('Precio ' + fmt(p.precioVenta) + ' · Costo ' + fmt(p.costoUnidad) + ' · Ganancia por unidad ' + fmt(p.gananciaUnidad)) : '';
  };
  sel.addEventListener('change', updateInfo);
  updateInfo();

  document.getElementById('v-submit').addEventListener('click', function(){
    var p = productos.map(withDerived).filter(function(x){return x.id===sel.value;})[0];
    if(!p) return;
    var cantidad = parseInt(document.getElementById('v-cantidad').value,10);
    if(!cantidad || cantidad<1) return;
    if(cantidad>p.stock){ alert('Stock insuficiente: quedan ' + p.stock + ' unidades de ' + p.marca + '.'); return; }
    var total = p.precioVenta*cantidad;
    var costoTotal = p.costoUnidad*cantidad;
    ventas.unshift({
      id: uid('v'), productoId: p.id, marca: p.marca, cantidad: cantidad,
      precioUnitario: p.precioVenta, costoUnitario: p.costoUnidad,
      total: total, costoTotal: costoTotal, gananciaTotal: total-costoTotal,
      fecha: document.getElementById('v-fecha').value || todayStr(),
      canal: document.getElementById('v-canal').value,
      cliente: document.getElementById('v-cliente').value.trim()
    });
    var prodRef = productos.find(function(x){return x.id===p.id;});
    prodRef.stock = Math.max(0, prodRef.stock - cantidad);
    save(); render();
  });

  document.querySelectorAll('[data-action="delete-venta"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var vid = btn.getAttribute('data-vid');
      var v = ventas.find(function(x){return x.id===vid;});
      if(!v) return;
      var p = productos.find(function(x){return x.id===v.productoId;});
      if(p) p.stock += v.cantidad;
      ventas = ventas.filter(function(x){return x.id!==vid;});
      save(); render();
    });
  });
}

function comprasHTML(){
  var prod = productos.map(withDerived);
  var options = prod.map(function(p){
    return '<option value="' + p.id + '">' + escapeHtml(p.marca) + ' — ' + escapeHtml(p.proveedor) + '</option>';
  }).join('');
  var rows = compras.map(function(c){
    var envio = c.costoEnvio || 0;
    var total = (c.costoCaja || 0) + envio;
    return '<tr><td>' + c.fecha + '</td><td style="font-weight:500;">' + escapeHtml(c.marca) + '</td>' +
      '<td>+' + c.cantidadUnidades + '</td><td style="color:var(--ink-soft);">' + (c.costoCaja?fmt(c.costoCaja):'—') + '</td>' +
      '<td style="color:var(--ink-soft);">' + (envio?fmt(envio):'—') + '</td>' +
      '<td style="font-weight:500;">' + (total?fmt(total):'—') + '</td>' +
      '<td><button class="btn-icon" data-action="delete-compra" data-cid="' + c.id + '">✕</button></td></tr>';
  }).join('');

  return '<div class="section-title"><div><h1 class="page-title">Compras</h1><p class="page-sub">Registrá reposiciones de stock a tus proveedores.</p></div></div>' +
    '<div class="card" style="margin-bottom:20px;"><div class="form-row-compras">' +
      '<label class="field">Producto<select id="c-producto"><option value="">Elegir producto…</option>' + options + '</select></label>' +
      '<label class="field">Unidades repuestas<input id="c-cantidad" type="number" min="1" placeholder="Ej: 12"></label>' +
      '<label class="field">Nuevo costo de caja (opcional)<input id="c-costo" type="number" placeholder="Si cambió el precio"></label>' +
      '<label class="field">Costo de envío (opcional)<input id="c-envio" type="number" placeholder="Si corresponde"></label>' +
      '<label class="field">Fecha<input id="c-fecha" type="date" value="' + todayStr() + '"></label>' +
      '<button class="btn-primary" id="c-submit">+ Registrar</button>' +
    '</div><label style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--ink-soft);">' +
    '<input type="checkbox" id="c-actualizar" style="width:auto;"> Actualizar el costo de caja del producto con este valor</label></div>' +
    '<div class="table-card"><div class="table-wrap"><table style="min-width:820px;">' +
    '<thead><tr>' + ['Fecha','Producto','Unidades','Costo caja','Envío','Total',''].map(function(h){return '<th>'+h+'</th>';}).join('') + '</tr></thead>' +
    '<tbody>' + (compras.length===0 ? '<tr><td colspan="7" style="padding:18px;text-align:center;color:var(--ink-faint);">Sin compras registradas todavía.</td></tr>' : rows) + '</tbody></table></div></div>';
}

function attachComprasHandlers(){
  document.getElementById('c-submit').addEventListener('click', function(){
    var sel = document.getElementById('c-producto');
    var p = productos.find(function(x){return x.id===sel.value;});
    if(!p) return;
    var cantidad = parseInt(document.getElementById('c-cantidad').value,10);
    if(!cantidad || cantidad<1) return;
    var costoInput = document.getElementById('c-costo').value;
    var envioInput = document.getElementById('c-envio').value;
    var actualizar = document.getElementById('c-actualizar').checked;
    var costoCaja = costoInput ? parseFloat(costoInput) : null;
    var costoEnvio = envioInput ? parseFloat(envioInput) : null;
    compras.unshift({ id: uid('c'), productoId: p.id, marca: p.marca, cantidadUnidades: cantidad, costoCaja: costoCaja, costoEnvio: costoEnvio, fecha: document.getElementById('c-fecha').value || todayStr() });
    p.stock += cantidad;
    if(actualizar && costoCaja) p.costoCaja = costoCaja;
    save(); render();
  });

  document.querySelectorAll('[data-action="delete-compra"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var cid = btn.getAttribute('data-cid');
      var c = compras.find(function(x){return x.id===cid;});
      if(!c) return;
      var p = productos.find(function(x){return x.id===c.productoId;});
      if(p) p.stock = Math.max(0, p.stock - c.cantidadUnidades);
      compras = compras.filter(function(x){return x.id!==cid;});
      save(); render();
    });
  });
}

load();
render();
</script>
